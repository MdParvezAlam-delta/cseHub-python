# Docker's embedded DNS. Using a variable in proxy_pass defers name
# resolution to request time, so Nginx starts even when the backend
# container is absent and survives backend restarts that change its IP.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    set $backend_upstream backend:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static frontend ──────────────────────────────────────────────────────

    # Never cache the entry document, or clients pin an old asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Extension-less paths fall through to the SPA entry document. Serving
    # /index.html here is an internal redirect, not a loop, because the exact
    # match above terminates it.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Django ───────────────────────────────────────────────────────────────
    # ^~ stops the static-asset regex above from stealing these requests.
    # proxy_pass has no URI part, so the request path passes through intact
    # (/api/articles/ -> backend:8000/api/articles/, not /api/api/articles/).

    location ^~ /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /admin/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Django static (admin CSS/JS, served by WhiteNoise).
    location ^~ /static/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User uploads (Cloudinary is primary; this is the local fallback).
    location ^~ /media/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
